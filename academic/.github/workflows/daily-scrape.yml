name: Academic Tracker - Daily Scraping

on:
  schedule:
    # Runs every day at 8:00 AM Paris time (UTC+1)
    - cron: '0 7 * * *'
  
  workflow_dispatch:  # Allows manual trigger
    inputs:
      skip_email:
        description: 'Skip email notifications'
        required: false
        default: 'false'

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🔄 Checkout repository
      uses: actions/checkout@v4
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --break-system-packages -r requirements.txt
    
    - name: 📥 Restore database cache
      uses: actions/cache@v4
      with:
        path: academic_tracker.db
        key: ${{ runner.os }}-db-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-db-
    
    - name: ⚙️ Configure scraper
      env:
        EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: |
        cat > config.json <<EOF
        {
          "database": "academic_tracker.db",
          "email": {
            "enabled": true,
            "recipient": "$EMAIL_RECIPIENT",
            "smtp_server": "smtp.gmail.com",
            "smtp_port": 587,
            "email": "$EMAIL_SENDER",
            "password": "$EMAIL_PASSWORD"
          },
          "scraping": {
            "housing_max_price": 600,
            "enable_housing": true,
            "enable_phd": true,
            "enable_internship": true
          }
        }
        EOF
    
    - name: 🔍 Run scraping
      run: |
        cd backend
        if [ "${{ github.event.inputs.skip_email }}" = "true" ]; then
          python main.py --no-email
        else
          python main.py
        fi
    
    - name: 📊 Generate statistics
      run: |
        cd backend
        python main.py --stats > stats.txt
        cat stats.txt
    
    - name: 💾 Save database
      uses: actions/upload-artifact@v4
      with:
        name: academic-tracker-db
        path: academic_tracker.db
        retention-days: 30
    
    - name: 📈 Update statistics badge
      run: |
        cd backend
        python -c "
        from database import DatabaseManager
        import json
        
        db = DatabaseManager('../academic_tracker.db')
        stats = db.get_statistics()
        db.close()
        
        total = stats['total_housing'] + stats['total_phd'] + stats['total_internship']
        pending = stats['pending_housing'] + stats['pending_phd'] + stats['pending_internship']
        
        badge_data = {
          'schemaVersion': 1,
          'label': 'offers',
          'message': f'{total} total • {pending} new',
          'color': 'green' if pending > 0 else 'blue'
        }
        
        with open('../badge.json', 'w') as f:
          json.dump(badge_data, f)
        "
    
    - name: 🚀 Commit and push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add academic_tracker.db badge.json || true
        git commit -m "🤖 Daily scraping update - $(date +'%Y-%m-%d')" || true
        git push || true
    
    - name: 🧹 Cleanup old data (weekly)
      if: github.event.schedule == '0 7 * * 0'  # Sundays only
      run: |
        cd backend
        python main.py --cleanup 90
    
    - name: ✅ Success notification
      if: success()
      run: |
        echo "✅ Scraping completed successfully!"
        echo "📊 Check the logs above for statistics"
    
    - name: ❌ Failure notification
      if: failure()
      run: |
        echo "❌ Scraping failed! Check the logs for details."
